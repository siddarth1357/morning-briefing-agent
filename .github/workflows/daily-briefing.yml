name: Daily Morning Briefing

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore briefing memory
        uses: actions/cache@v4
        with:
          path: memory/briefing_memory.db
          key: briefing-memory-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            briefing-memory-${{ github.ref }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run morning briefing
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EMAIL_ENABLED: ${{ secrets.EMAIL_ENABLED }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: |
          python run_once.py
          if [ -f run_output.txt ]; then
            cat run_output.txt
          fi

      - name: Upload memory database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-db
          path: memory/briefing_memory.db
          if-no-files-found: warn
          retention-days: 90
